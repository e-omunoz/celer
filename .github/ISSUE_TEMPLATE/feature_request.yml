name: Feature request
description: An idea to make Celer better
# status:triage: every request waits for triage (CONTRIBUTING.md, "Triage"). Celer's «Sugerir una mejora» window opens
# this form with the fields below already filled (by their ids: keep them in step with src/report.ts).
labels: [enhancement, "status:triage"]
body:
  - type: markdown
    attributes:
      value: In Celer, *Ayuda › Sugerir una mejora* fills this form for you.
  - type: textarea
    id: what
    attributes:
      label: What would you like Celer to do? · Qué te gustaría
      description: How it could look or work. Screenshots or examples from other tools are welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to do, and why? · Para qué / por qué
      description: Describe the task or the problem, not only the solution. "When I … I have to …"
  - type: input
    id: area
    attributes:
      label: Area · Área
      placeholder: Consola SQL, Resultados y rejilla, Conexiones, Exportar e importar, IA y MCP…
  - type: input
    id: version
    attributes:
      label: Celer version · Versión de Celer
      placeholder: 2.3.0
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots · Capturas
      description: Paste or drag images here.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
