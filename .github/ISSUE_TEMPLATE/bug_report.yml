name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please check the [open issues](https://github.com/e-omunoz/celer/issues) first. Security problems go to [SECURITY.md](https://github.com/e-omunoz/celer/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Run …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Celer version
      description: Settings → About, or the title of the release you installed.
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database
      multiple: true
      options: [PostgreSQL, MySQL, MariaDB, SQL Server, SQLite, Informix, ODBC (other), Not database related]
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Database server version
      placeholder: PostgreSQL 17.1
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Screenshots, error messages or logs
      description: The Output tab of the console shows the exact error. Remove passwords and personal data.
