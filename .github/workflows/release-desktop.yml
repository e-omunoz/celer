# Celer releases, built entirely on GitHub Actions for Windows, macOS and Linux.
#
# - Pushing a tag `vX.Y.Z` (dev/release.ps1 prepares and pushes it) builds the three platforms and publishes the
#   GitHub Release "Celer X.Y.Z" with the notes of CHANGELOG.md.
# - Running it by hand (Actions → Run workflow, or `gh workflow run release-desktop.yml --ref <branch>`) only builds
#   and keeps the files as the run's artifact `celer-release`, to try a branch. Nothing is published.
#
# The files have fixed names, without the version, so https://github.com/e-omunoz/celer/releases/latest/download/<name>
# always serves the latest one (the README buttons and the in-app updater rely on it):
#   Celer-Setup-Windows.exe        Celer Setup (installer/): per user, no administrator, updates itself
#   Celer-Portable-Windows.exe     runs without installing
#   Celer-macOS.dmg                universal (Apple silicon and Intel)
#   Celer-Linux.deb, Celer-Linux.rpm, Celer-Portable-Linux.AppImage
#   SHA256SUMS.txt                 one file with the SHA-256 of all of them
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows
            cache: "src-tauri\ninstaller/src-tauri"
          - os: macos-14
            label: macos
            cache: src-tauri
          - os: ubuntu-22.04
            label: linux
            cache: src-tauri
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # A tag must match the version in every manifest (dev/release.ps1 bumps them all before tagging).
      - name: Tag and version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json installer/src-tauri/tauri.conf.json; do
            grep -q "\"version\": \"$VERSION\"" "$f" || { echo "::error file=$f::version is not $VERSION"; exit 1; }
          done
          for f in src-tauri/Cargo.toml installer/src-tauri/Cargo.toml; do
            grep -q "^version = \"$VERSION\"" "$f" || { echo "::error file=$f::version is not $VERSION"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Release builds embed the JDBC bridge, compiled with javac (src-tauri/build.rs).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.cache }}

      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev rpm

      - name: Install
        run: npm ci

      # Windows: only celer.exe (the portable copy and Celer Setup's payload); no NSIS or MSI from Tauri.
      # Linux: .deb, .rpm and AppImage; macOS: the universal .app and its .dmg.
      - name: Build Celer
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            windows) npx tauri build --no-bundle ;;
            macos) npx tauri build --target universal-apple-darwin ;;
            linux) npx tauri build ;;
          esac

      - name: Build Celer Setup
        if: matrix.label == 'windows'
        run: |
          npx vite build --config installer/vite.config.ts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:CELER_PAYLOAD = Join-Path $PWD "src-tauri\target\release\celer.exe"
          cargo build --release --manifest-path installer/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --release --manifest-path installer/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.label }}" in
            windows)
              cp installer/src-tauri/target/release/celer-setup.exe out/Celer-Setup-Windows.exe
              cp src-tauri/target/release/celer.exe out/Celer-Portable-Windows.exe
              ;;
            macos)
              B=src-tauri/target/universal-apple-darwin/release/bundle
              cp "$(ls $B/dmg/*.dmg | head -n1)" out/Celer-macOS.dmg
              ;;
            linux)
              B=src-tauri/target/release/bundle
              cp "$(ls $B/deb/*.deb | head -n1)" out/Celer-Linux.deb
              cp "$(ls $B/rpm/*.rpm | head -n1)" out/Celer-Linux.rpm
              cp "$(ls $B/appimage/*.AppImage | head -n1)" out/Celer-Portable-Linux.AppImage
              ;;
          esac
          ls -la out

      # The version resource of the .exe files (antivirus heuristics look at it): shown in the log.
      - name: Version information
        if: matrix.label == 'windows'
        run: |
          Get-ChildItem out\*.exe | ForEach-Object {
            $v = $_.VersionInfo
            "{0}: {1} · {2} · {3} {4} · file {5} · {6}" -f $_.Name, $v.CompanyName, $v.FileDescription, $v.ProductName, $v.ProductVersion, $v.FileVersion, $v.LegalCopyright
            if (-not $v.CompanyName -or -not $v.FileDescription -or -not $v.ProductName) { Write-Error "$($_.Name): incomplete version information"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: celer-${{ matrix.label }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # Gathers the three platforms, checks the names, writes SHA256SUMS.txt and, for a tag, publishes the release.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: celer-*
          path: dist
          merge-multiple: true

      - name: Check the files and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected="Celer-Linux.deb Celer-Linux.rpm Celer-Portable-Linux.AppImage Celer-Portable-Windows.exe Celer-Setup-Windows.exe Celer-macOS.dmg"
          found="$(ls -1 | LC_ALL=C sort | xargs)"
          if [ "$found" != "$(printf '%s\n' $expected | LC_ALL=C sort | xargs)" ]; then
            echo "::error::unexpected release files: $found"; exit 1
          fi
          sha256sum $found > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: celer-release
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Celer $VERSION" > notes.md
          cat >> notes.md <<EOF

          ---
          ### Download Celer $VERSION

          | System | Package |
          |---|---|
          | **Windows** | [Celer-Setup-Windows.exe]($DL/Celer-Setup-Windows.exe): installs for your user, without administrator rights, and keeps itself up to date · portable: [Celer-Portable-Windows.exe]($DL/Celer-Portable-Windows.exe) |
          | **macOS** | [Celer-macOS.dmg]($DL/Celer-macOS.dmg) (Apple silicon and Intel) |
          | **Linux** | [Celer-Portable-Linux.AppImage]($DL/Celer-Portable-Linux.AppImage) · [Celer-Linux.deb]($DL/Celer-Linux.deb) · [Celer-Linux.rpm]($DL/Celer-Linux.rpm) |

          The packages are not code-signed. Verify any download with [SHA256SUMS.txt]($DL/SHA256SUMS.txt) (see SECURITY.md).
          EOF
          cat notes.md

      # gh uploads the files to a draft and publishes it once they are all there: /releases/latest never points to a
      # release with missing files.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Celer ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
