# Integration tests against real SQL Server 2022 and Informix (developer edition) servers, in containers.
# Runs src-tauri/src/engine_tests.rs: the drivers themselves and the exact SQL the interface writes for each
# engine (dev/engine-sql.ts). Informix runs over DRDA (IBM CLI) and over JDBC (Celer's bridge, Java 21 and the
# driver from Maven Central), and both read 200,000 rows to compare their speed (out/informix-speed.txt).
# Manual only (Actions → Run workflow, or `gh workflow run engines.yml`).
name: Engines (SQL Server, Informix)

on:
  workflow_dispatch:

jobs:
  engines:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MSSQL_PASSWORD: "Celer_Test_2026!"
    steps:
      - uses: actions/checkout@v7

      - name: Start the database servers
        run: |
          # The registries time out now and then: retry the pulls.
          for image in mcr.microsoft.com/mssql/server:2022-latest icr.io/informix/informix-developer-database:latest; do
            for attempt in 1 2 3 4 5; do docker pull -q "$image" && break; [ $attempt = 5 ] && exit 1; sleep 20; done
          done
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$MSSQL_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name ifx -h ifx --privileged -e LICENSE=accept -p 9088:9088 -p 9089:9089 icr.io/informix/informix-developer-database:latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev

      - name: IBM Data Server Driver (CLI), as Celer downloads it
        run: |
          curl -fsSL https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz | tar xz
          ls clidriver/lib | head

      - name: Informix JDBC driver, as Celer downloads it (same SHA-256)
        run: |
          mkdir -p jdbc && cd jdbc
          curl -fsSLO https://repo1.maven.org/maven2/com/ibm/informix/jdbc/15.0.1.4/jdbc-15.0.1.4.jar
          curl -fsSLO https://repo1.maven.org/maven2/org/mongodb/bson/3.8.0/bson-3.8.0.jar
          echo "152fe3380e414261266d7bde6bacae348c94b6db0cf16f969d1094368449cec7  jdbc-15.0.1.4.jar" | sha256sum -c
          echo "d30b5aeba3ae9b7c68c8a6103b41918c5f7318972007b9b92033ee861762d87e  bson-3.8.0.jar" | sha256sum -c

      - name: Build the tests
        working-directory: src-tauri
        env:
          CELER_REQUIRE_BRIDGE: "1"
        run: cargo test --lib --no-run

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; then echo ready; exit 0; fi
            sleep 5
          done
          docker logs mssql | tail -50; exit 1

      - name: Wait for Informix and create the test database
        run: |
          for i in $(seq 1 90); do
            if docker exec ifx bash -lc "echo 'SELECT COUNT(*) FROM systables' | dbaccess sysmaster -" >/dev/null 2>&1; then echo ready; break; fi
            sleep 5
          done
          docker exec ifx bash -lc "echo 'CREATE DATABASE celer WITH LOG' | dbaccess sysmaster -"
          docker exec ifx bash -lc "cat \$INFORMIXDIR/etc/\$ONCONFIG | grep -E '^(DBSERVERNAME|DBSERVERALIASES)'; cat \$INFORMIXSQLHOSTS" || true
          # JDBC goes to the container's own address: Informix's cancel is TCP urgent data, which Docker's port proxy
          # (localhost) may drop. The cancel test also goes through localhost on purpose, to try Celer's fallback.
          echo "IFX_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ifx)" >> "$GITHUB_ENV"

      # First, on an idle server: 200,000 rows over DRDA and over JDBC (a cancelled query may keep the server busy).
      - name: Informix speed, DRDA and JDBC
        working-directory: src-tauri
        timeout-minutes: 20
        env:
          CELER_MSSQL_TEST: "host=localhost port=1433 user=sa password=${{ env.MSSQL_PASSWORD }}"
          CELER_INFORMIX_TEST: "host=localhost port=9089 user=informix password=in4mix database=celer"
          CELER_IBM_LIB: ${{ github.workspace }}/clidriver/lib/libdb2.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/clidriver/lib
          CELER_INFORMIX_JDBC_TEST: "host=${{ env.IFX_IP }} port=9088 user=informix password=in4mix database=celer server=informix proxied=localhost"
          CELER_JAVA: ${{ env.JAVA_HOME }}/bin/java
          CELER_JDBC_JARS: ${{ github.workspace }}/jdbc/jdbc-15.0.1.4.jar:${{ github.workspace }}/jdbc/bson-3.8.0.jar
          CELER_REQUIRE_BRIDGE: "1"
          CELER_NODE: node
        run: cargo test --lib engine_tests::informix_speed -- --exact --nocapture --test-threads=1

      # A test that hangs prints the JDBC bridge's threads (jcmd) and fails before the step's timeout.
      - name: Integration tests
        working-directory: src-tauri
        timeout-minutes: 20
        env:
          CELER_MSSQL_TEST: "host=localhost port=1433 user=sa password=${{ env.MSSQL_PASSWORD }}"
          CELER_INFORMIX_TEST: "host=localhost port=9089 user=informix password=in4mix database=celer"
          CELER_IBM_LIB: ${{ github.workspace }}/clidriver/lib/libdb2.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/clidriver/lib
          CELER_INFORMIX_JDBC_TEST: "host=${{ env.IFX_IP }} port=9088 user=informix password=in4mix database=celer server=informix proxied=localhost"
          CELER_JAVA: ${{ env.JAVA_HOME }}/bin/java
          CELER_JDBC_JARS: ${{ github.workspace }}/jdbc/jdbc-15.0.1.4.jar:${{ github.workspace }}/jdbc/bson-3.8.0.jar
          CELER_REQUIRE_BRIDGE: "1"
          CELER_NODE: node
          # Reconnection tests end sessions with onmode -z when the SQL admin API is not there.
          CELER_INFORMIX_CONTAINER: ifx
        run: cargo test --lib engine_tests -- --skip informix_speed --nocapture --test-threads=1

      - name: Execution plans and server logs
        if: always()
        run: |
          mkdir -p out
          cp target-showplan-*.xml out/ 2>/dev/null || true
          cp target-informix-speed.txt out/informix-speed.txt 2>/dev/null || true
          cp src-tauri/target/celer-engine-tests/drivers/db2dsdriver.cfg out/ 2>/dev/null || true
          docker logs mssql > out/mssql.log 2>&1 || true
          docker logs ifx > out/informix.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engines
          path: out/
          retention-days: 7
