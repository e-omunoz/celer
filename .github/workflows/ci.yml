name: CI

# Kept lean on Actions minutes: docs/media changes don't run it, auto-commits carry [skip ci]
# (dev/autocommit.ps1), and a newer push cancels the run in progress.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/*.md", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/*.md", ".claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The JDBC bridge (src-tauri/bridge) is compiled by build.rs with javac, and run by its unit test.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      - name: Install
        run: npm ci

      # The pure TypeScript logic checks (dev/*-check.ts): a few seconds, no app or database needed.
      - name: Logic checks
        shell: bash
        run: |
          for check in dev/*-check.ts; do
            echo "::group::$check"
            node --experimental-strip-types --no-warnings "$check" || exit 1
            echo "::endgroup::"
          done

      - name: Typecheck and build the app UI
        run: npm run build

      - name: Typecheck the installer UI
        if: hashFiles('installer/tsconfig.json') != ''
        run: npx tsc --noEmit -p installer

      - name: Connection import checks
        run: node --experimental-strip-types --no-warnings dev/migrate-check.ts

      - name: Connection form checks
        run: node --experimental-strip-types --no-warnings dev/connform-check.ts

      - name: Explorer checks
        run: node --experimental-strip-types --no-warnings dev/explorer-check.ts

      - name: Rust tests
        working-directory: src-tauri
        run: |
          $env:CELER_TEST_JAVA = Join-Path $env:JAVA_HOME "bin\java.exe"
          cargo test --lib
        env:
          CELER_REQUIRE_BRIDGE: "1"
