name: CI

# Kept lean on Actions minutes: docs/media changes don't run it, auto-commits carry [skip ci]
# (dev/autocommit.ps1), and a newer push cancels the run in progress.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/*.md", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**", ".github/*.md", ".claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      - name: Install
        run: npm ci

      - name: Typecheck and build the app UI
        run: npm run build

      - name: Typecheck the installer UI
        if: hashFiles('installer/tsconfig.json') != ''
        run: npx tsc --noEmit -p installer

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
