# Categories for GitHub's generated release notes (pull requests by label).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ✨ New
      labels: [enhancement, feature]
    - title: 🐛 Fixes
      labels: [bug]
    - title: ⚡ Performance
      labels: [performance]
    - title: 🧰 Maintenance
      labels: ["*"]
