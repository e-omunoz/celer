# Monthly, and one grouped pull request per ecosystem: each PR runs CI, so fewer PRs means fewer
# Actions minutes. Security updates still arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"] }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
    open-pull-requests-limit: 1
