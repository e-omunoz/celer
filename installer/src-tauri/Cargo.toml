[package]
name = "celer-setup"
version = "1.3.1"
description = "Celer Setup - instalador de Celer"
authors = ["Celer"]
edition = "2021"

# Crate independiente: no forma parte de ningún workspace padre.
[workspace]

[[bin]]
name = "celer-setup"
path = "src/main.rs"

# Built with plain `cargo build` (dev/release.ps1), not the Tauri CLI: custom-protocol must be on by
# default so the UI is served from the embedded ../dist, never from the dev server on localhost:1430.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[dependencies]
# Sin "dynamic-acl" (las capacidades son estáticas): ~300 KB menos.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13", default-features = false }
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[profile.dev]
debug = "line-tables-only"

# El build.rs comprime ~20 MB con zstd: que el compresor (C) vaya optimizado también en debug.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3

# celer-setup.exe: lo más pequeño posible (la descompresión de zstd sigue siendo instantánea).
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
