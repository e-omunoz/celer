[package]
name = "celer"
version = "1.3.0"
description = "Celer - cliente SQL rápido"
authors = ["Celer"]
edition = "2021"

[lib]
name = "celer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "winauth", "native-tls", "chrono", "sql-browser-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
libloading = "0.9"
parking_lot = "0.12"
anyhow = "1"
# Native credential stores: Windows Credential Manager, macOS Keychain, Linux Secret Service (keyutils fallback).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = { version = "0.99", default-features = false }
ureq = "3"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "7"
# Servidor MCP: patrón de columnas sensibles (src/mcp.rs)
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = "0.4.46"
# PostgreSQL (sync client over tokio-postgres) — owned by src/postgres.rs
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rust_decimal = { version = "1", features = ["db-postgres"] }
# MySQL / MariaDB — owned by src/mysql.rs
mysql = { version = "26", default-features = false, features = ["minimal-rust", "native-tls"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
