# Every database engine Celer supports, in WSL (dev\wsl.ps1 db up). WSL2 forwards these ports to Windows localhost,
# so the Windows desktop app connects to them like any server. Ports differ from the portable Windows servers
# (dev\testdb-*.ps1: PostgreSQL 54329, MariaDB 33069) so both can run at once, and stay out of the ranges Windows
# reserves for Hyper-V (netsh int ipv4 show excludedportrange protocol=tcp; 55406-55505 here).
#
#   PostgreSQL 17   localhost:15432  celer/celer, database celer
#   MySQL 8.4       localhost:33306  root/celer, celer/celer
#   MariaDB 11.4    localhost:33307  root/celer, celer/celer
#   SQL Server 2022 localhost:1433   sa/Celer_Test_2026!
#   Informix        localhost:9088 (SQLI/JDBC), 9089 (DRDA)  informix/in4mix, server informix
#   SSH bastion     localhost:2222   celer/celer, or the key ~/celer-drivers/ssh/id_ed25519 (engines.sh up makes it)
#
# The bastion (sshd) is the way to test SSH tunnels: from it the engines are celer-pg:5432, celer-mysql:3306,
# celer-mariadb:3306, celer-mssql:1433 and celer-ifx:9088/9089, names that only resolve inside this Docker network,
# so a connection to them works only through the tunnel. Its host key is made when the image is built, so restarting
# the container (docker restart celer-sshd, to drop every tunnel) keeps it.
name: celer-engines

services:
  postgres:
    image: postgres:17
    container_name: celer-pg
    environment: { POSTGRES_USER: celer, POSTGRES_PASSWORD: celer, POSTGRES_DB: celer }
    ports: ["15432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: celer-mysql
    environment: { MYSQL_ROOT_PASSWORD: celer }
    ports: ["33306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: celer-mariadb
    environment: { MARIADB_ROOT_PASSWORD: celer }
    ports: ["33307:3306"]
    volumes: [mariadb-data:/var/lib/mysql]
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: celer-mssql
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Celer_Test_2026!" }
    ports: ["1433:1433"]
    volumes: [mssql-data:/var/opt/mssql]
    restart: unless-stopped

  informix:
    image: icr.io/informix/informix-developer-database:latest
    container_name: celer-ifx
    hostname: ifx
    privileged: true
    environment: { LICENSE: accept }
    ports: ["9088:9088", "9089:9089"]
    volumes: [ifx-data:/opt/ibm/data]
    restart: unless-stopped

  sshd:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh-server \
         && ssh-keygen -A \
         && adduser -D -s /bin/sh celer && echo 'celer:celer' | chpasswd \
         && sed -i -E '/^(AllowTcpForwarding|PasswordAuthentication|AuthorizedKeysFile|StrictModes)/d' /etc/ssh/sshd_config \
         && printf 'AllowTcpForwarding yes\nPasswordAuthentication yes\nStrictModes no\nAuthorizedKeysFile /keys/authorized_keys .ssh/authorized_keys\n' >> /etc/ssh/sshd_config
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    image: celer-sshd
    container_name: celer-sshd
    ports: ["2222:22"]
    volumes: ["${HOME}/celer-drivers/ssh:/keys:ro"]
    restart: unless-stopped

volumes:
  pg-data:
  mysql-data:
  mariadb-data:
  mssql-data:
  ifx-data:
