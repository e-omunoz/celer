<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" fill="none">
  <defs>
    <radialGradient id="poker-fur" cx="32%" cy="28%" r="78%">
      <stop stop-color="#8B6246"/>
      <stop offset="1" stop-color="#56392A"/>
    </radialGradient>
    <linearGradient id="poker-shirt" x1="100" y1="150" x2="100" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#D5D8DE"/>
    </linearGradient>
    <linearGradient id="poker-sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4F4F0"/>
      <stop offset="1" stop-color="#D9DCE2"/>
    </linearGradient>
    <clipPath id="poker-eye-l"><ellipse cx="79" cy="84" rx="15" ry="16"/></clipPath>
    <clipPath id="poker-eye-r"><ellipse cx="121" cy="84" rx="15" ry="16"/></clipPath>
  </defs>
  <!-- Rig: .g-all (whole body, pivots at the feet) > body, .arm-l, .g-head, .arm-r > .fore-r (elbow). Both arms in front of the shirt.
       Props (.prop-mug, .prop-book) are display="none" here; the app shows them during idle activities. -->
  <g class="g-all">
    <g id="poker-body">
      <path fill="url(#poker-shirt)" stroke="#C9CDD4" stroke-width="1.2" d="M46 232v-24c0-33 15-50 35-54h38c20 4 35 21 35 54v24z"/>
      <path d="M100 160v72" stroke="#CDD0D6" stroke-width="1.2"/>
      <circle cx="100" cy="214" r="1.8" fill="#BFC3CA"/>
      <ellipse cx="100" cy="150" rx="19" ry="8" fill="url(#poker-fur)"/>
      <path fill="#FAFAF7" stroke="#C9CDD4" d="M100 157 84 146 79 167z"/>
      <path fill="#FAFAF7" stroke="#C9CDD4" d="M100 157 116 146 121 167z"/>
      <g id="poker-tie" class="tie">
        <path fill="#1B1C21" d="M95 158h10l2 8.5H93z"/>
        <path fill="#1B1C21" d="M93 166.5h14L111 199 100 209 89 199z"/>
        <path d="M96 170l9 12M95 182l11 13" stroke="#2C2E35" stroke-width="2"/>
      </g>
    </g>
    <g class="arm-l">
      <rect x="51" y="162" width="18" height="32" rx="9" fill="url(#poker-sleeve)" stroke="#C9CDD4" stroke-width="1.2"/>
      <rect x="53.5" y="190" width="13" height="26" rx="6.5" fill="url(#poker-fur)"/>
      <circle cx="60" cy="219" r="8.5" fill="#F2D0AC" stroke="#D4AC86" stroke-width="1.2"/>
    </g>
    <g class="g-head">
      <g id="poker-ears">
        <g class="ear-l"><circle cx="36" cy="94" r="22" fill="url(#poker-fur)"/><circle cx="44" cy="96" r="13.5" fill="#E2B38B"/></g>
        <g class="ear-r"><circle cx="164" cy="94" r="22" fill="url(#poker-fur)"/><circle cx="156" cy="96" r="13.5" fill="#E2B38B"/></g>
      </g>
      <g id="poker-head">
        <ellipse cx="100" cy="88" rx="64" ry="58" fill="url(#poker-fur)"/>
        <g id="poker-tufts" class="tufts" fill="url(#poker-fur)">
          <path class="tuft" d="M76 50c-6-18 8-30 16-12-4 6-10 12-16 12z"/>
          <path class="tuft" d="M94 42c2-22 18-24 20-2-6 4-14 6-20 2z"/>
          <path class="tuft" d="M124 50c8-20 22-14 12 2-6 2-12 2-12-2z"/>
        </g>
      </g>
      <g id="poker-face" fill="#F2D0AC">
        <circle cx="79" cy="86" r="27"/>
        <circle cx="121" cy="86" r="27"/>
        <ellipse cx="100" cy="118" rx="37" ry="25"/>
        <ellipse class="blush" cx="62" cy="108" rx="11" ry="6" fill="#F4A6A0" opacity=".35"/>
        <ellipse class="blush" cx="138" cy="108" rx="11" ry="6" fill="#F4A6A0" opacity=".35"/>
      </g>
      <g id="poker-eyes">
        <ellipse cx="79" cy="84" rx="15" ry="16" fill="#fff"/>
        <ellipse cx="121" cy="84" rx="15" ry="16" fill="#fff"/>
        <g class="pupils">
          <circle cx="79" cy="89" r="6.6" fill="#24170F"/>
          <circle cx="121" cy="89" r="6.6" fill="#24170F"/>
          <circle cx="81.6" cy="86.4" r="2.1" fill="#fff"/>
          <circle cx="123.6" cy="86.4" r="2.1" fill="#fff"/>
        </g>
        <g class="lids" clip-path="url(#poker-eye-l)">
          <rect class="lid" x="62" y="68" width="34" height="16" fill="#E7BE96"/>
          <path d="M65 84q14 4 28 0" stroke="#9A6A49" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g class="lids" clip-path="url(#poker-eye-r)">
          <rect class="lid" x="104" y="68" width="34" height="16" fill="#E7BE96"/>
          <path d="M107 84q14 4 28 0" stroke="#9A6A49" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
      <g id="poker-brows" class="brows" stroke="#56392A" stroke-width="5" stroke-linecap="round">
        <path class="brow-l" d="M66 68c8-2 16-2 24 1"/>
        <path class="brow-r" d="M110 60c8-6 18-4 26 2"/>
      </g>
      <g id="poker-nose" fill="#9A6A49">
        <ellipse cx="94" cy="111" rx="2.2" ry="1.5"/>
        <ellipse cx="106" cy="111" rx="2.2" ry="1.5"/>
      </g>
      <path id="poker-mouth" class="mouth" d="M96 127h16" stroke="#9A6A49" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g class="arm-r">
      <rect x="131" y="162" width="18" height="32" rx="9" fill="url(#poker-sleeve)" stroke="#C9CDD4" stroke-width="1.2"/>
      <g class="fore-r">
        <rect x="133.5" y="190" width="13" height="26" rx="6.5" fill="url(#poker-fur)"/>
        <!-- Props (hidden unless an activity shows them): a coffee mug held by the right hand, kept upright by
             counter-rotating it around the hand while the arm moves. -->
        <g class="prop prop-mug" display="none">
          <path d="M137 200h5a7 7 0 0 1 0 14h-5" stroke="#E9E2D6" stroke-width="3"/>
          <rect x="109" y="193" width="29" height="31" rx="5" fill="#F7F3EC" stroke="#CDBFAE" stroke-width="1.3"/>
          <rect x="109" y="205" width="29" height="6.5" fill="#D97757"/>
          <ellipse cx="123.5" cy="194.6" rx="12.2" ry="3.3" fill="#6B4630"/>
        </g>
        <rect class="finger" x="136.6" y="221" width="6.8" height="15" rx="3.4" fill="#F2D0AC" stroke="#D4AC86" stroke-width="1.2"/>
        <circle cx="140" cy="219" r="8.5" fill="#F2D0AC" stroke="#D4AC86" stroke-width="1.2"/>
        <path d="M134.5 214.5q-3.5 2-1.5 5.5" stroke="#D4AC86" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Prop: an open book held at the chest with both thumbs over the pages (reading activity). -->
    <g class="prop prop-book" display="none">
      <path d="M100 182c-12-5-24-6-36-3v34c12-3 24-2 36 3z" fill="#D97757"/>
      <path d="M100 182c12-5 24-6 36-3v34c-12-3-24-2-36 3z" fill="#C4623F"/>
      <path d="M100 184c-10-4-21-5-32-2.5v29c11-2.5 22-1.5 32 2.5z" fill="#FBF8F2"/>
      <path d="M100 184c10-4 21-5 32-2.5v29c-11-2.5-22-1.5-32 2.5z" fill="#F1ECE2"/>
      <g stroke="#C9C2B6" stroke-width="1.2" stroke-linecap="round">
        <path d="M73 190h20M73 195h22M73 200h17M73 205h21"/>
        <path d="M106 190h20M106 195h18M106 200h21M106 205h15"/>
      </g>
      <path class="page" d="M100 184c10-4 21-5 32-2.5v29c-11-2.5-22-1.5-32 2.5z" fill="#F7F3EC" stroke="#DDD5C8" stroke-width=".8"/>
      <path d="M100 183v32" stroke="#A9502F" stroke-width="1.4"/>
      <circle cx="70" cy="207" r="5.5" fill="#F2D0AC" stroke="#D4AC86" stroke-width="1.1"/>
      <circle cx="130" cy="207" r="5.5" fill="#F2D0AC" stroke="#D4AC86" stroke-width="1.1"/>
    </g>
  </g>
</svg>
