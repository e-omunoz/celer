<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" fill="none">
  <defs>
    <radialGradient id="monday-fur" cx="32%" cy="28%" r="78%">
      <stop stop-color="#8B6246"/>
      <stop offset="1" stop-color="#56392A"/>
    </radialGradient>
    <linearGradient id="monday-shirt" x1="100" y1="150" x2="100" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F4"/>
      <stop offset="1" stop-color="#DCDEE3"/>
    </linearGradient>
    <clipPath id="monday-eye-l"><ellipse cx="79" cy="84" rx="15" ry="16"/></clipPath>
    <clipPath id="monday-eye-r"><ellipse cx="121" cy="84" rx="15" ry="16"/></clipPath>
    <clipPath id="monday-eye-whites"><ellipse cx="79" cy="84" rx="15" ry="16"/><ellipse cx="121" cy="84" rx="15" ry="16"/></clipPath>
  </defs>
  <!-- Rig as in gib-poker.svg: .g-all (whole body) > body, .g-head (everything that moves with the head). -->
  <g class="g-all">
    <g id="monday-body">
      <path fill="url(#monday-shirt)" d="M50 210c0-34 14-52 32-56h36c18 4 32 22 32 56H50z"/>
      <ellipse cx="100" cy="150" rx="19" ry="8" fill="url(#monday-fur)"/>
      <path fill="#F7F7F4" stroke="#DCDEE3" d="M100 157 82 138 78 162z"/>
      <path fill="#F7F7F4" stroke="#DCDEE3" d="M100 157 115 147 120 166z"/>
      <g class="tie" transform="rotate(11 100 182)">
        <path fill="#16171B" d="M95 158h10l2 8.5H93z"/>
        <path fill="#16171B" d="M94 166h12l4 28-10 8-12-10z"/>
      </g>
    </g>
    <!-- acc:neck (Settings › Apariencia › Gib: the app inserts the accessories here and in acc:head) -->
    <g class="g-head">
      <g id="monday-ears">
        <circle cx="36" cy="94" r="22" fill="url(#monday-fur)"/>
        <circle cx="164" cy="94" r="22" fill="url(#monday-fur)"/>
        <circle cx="44" cy="96" r="13.5" fill="#E2B38B"/>
        <circle cx="156" cy="96" r="13.5" fill="#E2B38B"/>
      </g>
      <ellipse cx="100" cy="88" rx="64" ry="58" fill="url(#monday-fur)"/>
      <g class="tufts" fill="url(#monday-fur)">
        <path class="tuft" d="M58 70c-16-8-14-24 2-20 6 8 8 16-2 20z"/>
        <path class="tuft" d="M70 46c-10-16 2-28 14-14-4 6-8 12-14 14z"/>
        <path class="tuft" d="M88 36c-2-20 14-26 18-6-6 2-12 4-18 6z"/>
        <path class="tuft" d="M108 32c6-18 22-16 16 4-8 2-14 2-16-4z"/>
        <path class="tuft" d="M128 42c12-16 26-8 14 8-6 2-12 0-14-8z"/>
        <path class="tuft" d="M142 62c16-10 24 4 8 14-6-2-12-6-8-14z"/>
        <path class="tuft" d="M48 96c-14 2-16 16-4 16 6-6 8-12 4-16z"/>
        <path class="tuft" d="M154 92c14-4 20 10 6 16-6-4-10-10-6-16z"/>
      </g>
      <g fill="#F2D0AC">
        <circle cx="79" cy="86" r="27"/>
        <circle cx="121" cy="86" r="27"/>
        <ellipse cx="100" cy="118" rx="37" ry="25"/>
        <ellipse class="blush" cx="62" cy="108" rx="11" ry="6" fill="#F4A6A0" opacity=".35"/>
        <ellipse class="blush" cx="138" cy="108" rx="11" ry="6" fill="#F4A6A0" opacity=".35"/>
      </g>
      <g class="eyes">
        <ellipse class="eye-white" cx="79" cy="84" rx="15" ry="16" fill="#fff"/>
        <ellipse class="eye-white" cx="121" cy="84" rx="15" ry="16" fill="#fff"/>
        <!-- Pupils: clipped to the eye whites (they can look anywhere and never leave the eye). .pupils follows the
             cursor and the mood (clamped per pose in CSS), .gaze plays the activities, .pupil scales on its own centre. -->
        <g clip-path="url(#monday-eye-whites)">
          <g class="pupils">
            <g class="gaze">
              <g class="pupil"><circle cx="77" cy="90" r="6.6" fill="#24170F"/><circle cx="79.4" cy="87.4" r="2.1" fill="#fff"/></g>
              <g class="pupil"><circle cx="119" cy="90" r="6.6" fill="#24170F"/><circle cx="121.4" cy="87.4" r="2.1" fill="#fff"/></g>
            </g>
          </g>
        </g>
        <g class="lids" clip-path="url(#monday-eye-l)">
          <g class="lid">
            <path d="M60 40H98V88H93Q79 92 65 88H60Z" fill="#E7BE96"/>
            <path d="M65 88q14 4 28 0" stroke="#9A6A49" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>
        <g class="lids" clip-path="url(#monday-eye-r)">
          <g class="lid">
            <path d="M102 40H140V88H135Q121 92 107 88H102Z" fill="#E7BE96"/>
            <path d="M107 88q14 4 28 0" stroke="#9A6A49" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>
      </g>
      <path d="M66 102c6 4 14 4 20 0" stroke="#E2B38B" stroke-width="2" stroke-linecap="round"/>
      <path d="M114 102c6 4 14 4 20 0" stroke="#E2B38B" stroke-width="2" stroke-linecap="round"/>
      <g class="brows" stroke="#56392A" stroke-width="5" stroke-linecap="round">
        <path class="brow-l" d="M66 74h24"/>
        <path class="brow-r" d="M110 74h24"/>
      </g>
      <g fill="#9A6A49">
        <ellipse cx="94" cy="111" rx="2.2" ry="1.5"/>
        <ellipse cx="106" cy="111" rx="2.2" ry="1.5"/>
      </g>
      <path class="mouth" d="M94 128c6 2 12-1 18 2" stroke="#9A6A49" stroke-width="2.2" stroke-linecap="round"/>
      <!-- acc:head -->
    </g>
    <g class="mug">
      <rect x="128" y="148" width="34" height="42" rx="6" fill="#F7F7F4"/>
      <rect x="128" y="160" width="34" height="8" fill="#F26B1D"/>
      <path d="M162 160c12 4 12 18 0 22" stroke="#DCDEE3" stroke-width="4" stroke-linecap="round"/>
      <path class="steam" d="M138 144c4-8-2-12 2-20" stroke="#C5CAD3" stroke-width="2" stroke-linecap="round"/>
      <path class="steam" d="M150 142c4-8-2-14 2-22" stroke="#C5CAD3" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
